name: Release packages

on:
  push:
    branches: [main, sdk-54, sdk-55]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, pack, and preview npm tag updates without publishing
        type: boolean
        default: true

permissions: {}

# Pushes perform real releases. Manual dispatch defaults to a dry run.
jobs:
  mode:
    if: >-
      github.repository == 'shirakaba/expo-desktop' &&
      contains(fromJSON('["main", "sdk-54", "sdk-55"]'), github.ref_name) &&
      github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          cache: true
          require-lockfile: true
          runtime: node@lts
      - id: mode
        run: node --run release:mode

  version:
    needs: mode
    if: >-
      needs.mode.outputs.mode == 'version' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run))
    runs-on: ubuntu-latest
    concurrency:
      group: release-version-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          cache: true
          require-lockfile: true
          runtime: node@lts
      - uses: changesets/action/version@v2
        with:
          script: node --run r2
          commit-message: Version packages (${{ github.ref_name }})
          pr-title: Version packages (${{ github.ref_name }})
          pr-base-branch: ${{ github.ref_name }}

  publish:
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # Keep this filename and environment aligned with npm trusted publishing.
    environment: Stable Release
    concurrency:
      # Shared package names exist on every branch. Serialize registry mutations.
      group: publish-npm
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          cache: true
          require-lockfile: true
          runtime: node@lts
      - name: Validate the release without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: node --run r3 -- --dry-run
      - name: Install npm with trusted dist-tag support
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        run: npm install --global npm@^11.21.0
      - name: Publish packages and create GitHub releases
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        uses: changesets/action/publish@v2
        with:
          script: node --run r3
