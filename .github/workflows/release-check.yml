name: Release checks

on:
  pull_request:
    branches: [main, sdk-54, sdk-55]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          version: latest
          cache: true
          require-lockfile: true
          runtime: node@lts
      - name: Validate changesets against the PR target
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node --run release:check -- --since "origin/$BASE_REF"
